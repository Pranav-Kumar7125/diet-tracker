services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: diettracker
      POSTGRES_USER: diet
      POSTGRES_PASSWORD: diet
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diet -d diettracker"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/diettracker
      DB_USER: diet
      DB_PASS: diet
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-change-this-secret-123}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  dbdata:
